<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

<style>
  :root{
    --bg:#F2F6FA;
    --surface:#FFFFFF;
    --surface-2:#EAEFF6;
    --surface-3:#DEE5F0;
    --border:#D2DAE8;
    --border-soft:#E2E8F2;
    --text:#2C3245;
    --text-muted:#6B7388;
    --text-faint:#9AA2B6;
    --brass:#6E7AA3;
    --brass-dim:#565F82;
    --sage:#4C8A6B;
    --sage-dim:#396950;
    --rust:#BD5138;
    --rust-dim:#8A3A28;
    --font-display:'Noto Serif TC', serif;
    --font-body:'Noto Sans TC', sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:var(--font-body);
    background:var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
  }
  #app{
    display:flex;
    min-height:100vh;
  }
  ::selection{ background:var(--brass); color:#FFFFFF; }

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:280px;
    flex-shrink:0;
    background:var(--surface);
    border-right:1px solid var(--border-soft);
    display:flex;
    flex-direction:column;
    padding:28px 20px;
  }
  .brand-logo{
    margin:-4px -4px 22px;
    padding:14px 10px 16px;
    border-radius:6px;
    overflow:hidden;
  }
  .brand-logo img{
    display:block;
    width:100%;
    height:auto;
  }
  .brand-eyebrow{
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:0.18em;
    color:var(--brass);
    text-transform:uppercase;
    margin-bottom:6px;
  }
  .brand-title{
    font-family:var(--font-display);
    font-size:24px;
    font-weight:700;
    line-height:1.3;
    margin:0 0 24px 0;
    color:var(--text);
  }
  .sidebar-section-label{
    font-family:var(--font-mono);
    font-size:10px;
    letter-spacing:0.14em;
    color:var(--text-faint);
    text-transform:uppercase;
    margin:4px 0 10px 2px;
  }
  .project-list{
    flex:1;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:6px;
    margin-bottom:16px;
  }
  .project-tab{
    position:relative;
    display:flex;
    flex-direction:column;
    gap:3px;
    padding:12px 14px;
    border-radius:3px;
    border:1px solid transparent;
    background:transparent;
    cursor:pointer;
    text-align:left;
    transition:background .15s ease, border-color .15s ease;
  }
  .project-tab:hover{ background:var(--surface-2); }
  .project-tab.active{
    background:var(--surface-2);
    border-color:var(--border);
  }
  .project-tab.active::before{
    content:"";
    position:absolute;
    left:-20px; top:8px; bottom:8px;
    width:3px;
    background:var(--brass);
    border-radius:0 2px 2px 0;
  }
  .project-tab-name{
    font-weight:600;
    font-size:14px;
    color:var(--text);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .project-tab-cost{
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--text-muted);
  }
  .empty-sidebar-hint{
    font-size:12px;
    color:var(--text-faint);
    padding:10px 2px;
    line-height:1.6;
  }
  .btn{
    font-family:var(--font-body);
    font-weight:600;
    font-size:13px;
    border-radius:3px;
    border:1px solid var(--border);
    background:var(--surface-2);
    color:var(--text);
    padding:10px 14px;
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease, color .15s ease;
  }
  .btn:hover{ border-color:var(--brass); color:var(--brass); }
  .btn-primary{
    background:var(--brass);
    border-color:var(--brass);
    color:#FFFFFF;
  }
  .btn-primary:hover{ background:var(--brass-dim); color:#FFFFFF; border-color:var(--brass-dim); }
  .btn-block{ width:100%; text-align:center; }
  .btn-danger{ border-color:var(--rust-dim); color:var(--rust); }
  .btn-danger:hover{ border-color:var(--rust); background:rgba(189,81,56,.12); }
  .btn-ghost{ background:transparent; border-color:transparent; color:var(--text-muted); padding:6px 10px;}
  .btn-ghost:hover{ background:var(--surface-3); color:var(--text); }
  .btn-sm{ font-size:12px; padding:6px 10px; }

  /* ---------- Main ---------- */
  .main{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:20px 36px;
    border-bottom:1px solid var(--border-soft);
    background:var(--bg);
  }
  .tabs{ display:flex; gap:4px; }
  .tab-btn{
    font-family:var(--font-mono);
    font-size:12px;
    letter-spacing:.06em;
    text-transform:uppercase;
    padding:9px 16px;
    border-radius:3px;
    border:1px solid transparent;
    background:transparent;
    color:var(--text-muted);
    cursor:pointer;
  }
  .tab-btn.active{
    color:var(--brass);
    border-color:var(--border);
    background:var(--surface);
  }
  .content{
    flex:1;
    overflow-y:auto;
    padding:32px 36px 80px;
  }

  /* ---------- Empty state ---------- */
  .empty-state{
    max-width:420px;
    margin:80px auto;
    text-align:center;
    color:var(--text-muted);
  }
  .empty-state h2{
    font-family:var(--font-display);
    color:var(--text);
    font-size:22px;
    margin-bottom:10px;
  }
  .empty-state p{ font-size:14px; line-height:1.7; margin-bottom:22px; }

  /* ---------- Product header ---------- */
  .product-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:24px;
    margin-bottom:28px;
    flex-wrap:wrap;
  }
  .product-title-input{
    font-family:var(--font-display);
    font-size:28px;
    font-weight:700;
    background:transparent;
    border:none;
    border-bottom:1px solid transparent;
    color:var(--text);
    padding:2px 0;
    width:100%;
    max-width:480px;
  }
  .product-title-input:hover, .product-title-input:focus{
    border-bottom:1px dashed var(--border);
    outline:none;
  }
  .product-meta{
    display:flex;
    gap:22px;
    margin-top:10px;
    flex-wrap:wrap;
  }
  .meta-field label{
    display:block;
    font-family:var(--font-mono);
    font-size:10px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--text-faint);
    margin-bottom:5px;
  }
  .meta-field input{
    font-family:var(--font-mono);
    font-size:14px;
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:3px;
    color:var(--text);
    padding:7px 10px;
    width:140px;
  }
  .meta-field input:focus{ outline:none; border-color:var(--brass); }

  /* ---------- Stat cards ---------- */
  .stat-row{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:14px;
    margin-bottom:30px;
  }
  .stat-card{
    background:var(--surface);
    border:1px solid var(--border-soft);
    border-radius:4px;
    padding:16px 18px;
  }
  .stat-label{
    font-family:var(--font-mono);
    font-size:10px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--text-faint);
    margin-bottom:8px;
  }
  .stat-value{
    font-family:var(--font-mono);
    font-size:22px;
    font-weight:600;
    color:var(--text);
  }
  .stat-value.pos{ color:var(--sage); }
  .stat-value.neg{ color:var(--rust); }
  .stat-hint{
    font-size:11px;
    color:var(--text-faint);
    margin-top:6px;
    line-height:1.4;
  }

  .stamp-card{
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .stamp{
    width:78px; height:78px;
    border-radius:50%;
    border:2px solid currentColor;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    transform:rotate(-7deg);
    position:relative;
  }
  .stamp::before{
    content:"";
    position:absolute;
    inset:5px;
    border:1px dashed currentColor;
    border-radius:50%;
    opacity:.55;
  }
  .stamp-pct{
    font-family:var(--font-mono);
    font-weight:700;
    font-size:17px;
    line-height:1;
  }
  .stamp-label{
    font-family:var(--font-mono);
    font-size:8px;
    letter-spacing:.08em;
    margin-top:3px;
  }
  .stamp.sage{ color:var(--sage); }
  .stamp.rust{ color:var(--rust); }
  .stamp.brass{ color:var(--brass); }

  /* ---------- Category breakdown ---------- */
  .section-title{
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--text-faint);
    margin:0 0 12px 2px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .section-title::after{
    content:"";
    flex:1;
    height:1px;
    background:var(--border-soft);
  }
  .breakdown{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-bottom:32px;
  }
  .breakdown-row{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .breakdown-name{
    width:96px;
    flex-shrink:0;
    font-size:13px;
    color:var(--text-muted);
  }
  .breakdown-bar-track{
    flex:1;
    height:8px;
    background:var(--surface-2);
    border-radius:2px;
    overflow:hidden;
  }
  .breakdown-bar-fill{
    height:100%;
    background:var(--brass);
    border-radius:2px;
  }
  .breakdown-value{
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--text-muted);
    width:130px;
    text-align:right;
    flex-shrink:0;
  }

  /* ---------- Expense form ---------- */
  .expense-form{
    background:var(--surface);
    border:1px solid var(--border-soft);
    border-radius:4px;
    padding:18px;
    margin-bottom:24px;
    display:grid;
    grid-template-columns:0.9fr 1.3fr 0.9fr 1fr 0.9fr 0.9fr 1.3fr auto;
    gap:10px;
    align-items:end;
  }
  .field label{
    display:block;
    font-family:var(--font-mono);
    font-size:10px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--text-faint);
    margin-bottom:6px;
  }
  .field input, .field select{
    width:100%;
    font-family:var(--font-body);
    font-size:13px;
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:3px;
    color:var(--text);
    padding:8px 9px;
  }
  .field input:focus, .field select:focus{ outline:none; border-color:var(--brass); }

  /* ---------- Ledger table ---------- */
  .ledger{
    width:100%;
    border-collapse:collapse;
  }
  .ledger thead th{
    text-align:left;
    font-family:var(--font-mono);
    font-size:10px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--text-faint);
    padding:0 10px 10px;
    border-bottom:1px solid var(--border);
  }
  .th-sort-btn{
    background:none;
    border:none;
    padding:0;
    font-family:inherit;
    font-size:inherit;
    font-weight:inherit;
    letter-spacing:inherit;
    text-transform:inherit;
    color:inherit;
    cursor:pointer;
  }
  .th-sort-btn:hover{ color:var(--brass); }
  .ledger tbody td{
    padding:11px 10px;
    border-bottom:1px solid var(--border-soft);
    font-size:13px;
    vertical-align:middle;
  }
  .ledger tbody tr:hover{ background:var(--surface); }
  .ledger .num{ font-family:var(--font-mono); text-align:right; }
  .cat-chip{
    display:inline-block;
    font-family:var(--font-mono);
    font-size:10px;
    letter-spacing:.04em;
    padding:3px 8px;
    border-radius:10px;
    border:1px solid var(--border);
    color:var(--text-muted);
    white-space:nowrap;
  }
  .ledger tfoot td{
    padding:14px 10px 0;
    font-family:var(--font-mono);
    font-weight:600;
    font-size:14px;
    border-top:2px solid var(--border);
  }
  .muted-cell{ color:var(--text-faint); }
  .row-del-btn{
    background:none;border:none;color:var(--text-faint);cursor:pointer;font-size:13px;padding:4px 6px;border-radius:3px;
  }
  .row-del-btn:hover{ color:var(--rust); background:rgba(189,81,56,.12); }
  .row-actions{
    display:flex;
    align-items:center;
    gap:2px;
    white-space:nowrap;
  }
  .row-move-btn{
    background:none;
    border:none;
    color:var(--text-muted);
    cursor:pointer;
    font-size:10px;
    padding:5px 6px;
    border-radius:3px;
    line-height:1;
  }
  .row-move-btn:hover{ color:var(--brass); background:var(--surface-2); }
  .row-move-btn:disabled{ color:var(--border); cursor:default; background:none; }
  .amortize-input{
    width:90px;
    font-family:var(--font-mono);
    font-size:12px;
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:3px;
    color:var(--text);
    padding:5px 7px;
  }
  .amortize-input:focus{ outline:none; border-color:var(--brass); }
  .amount-input{
    width:100px;
    font-family:var(--font-mono);
    font-size:13px;
    text-align:right;
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:3px;
    color:var(--text);
    padding:5px 7px;
  }
  .amount-input:focus{ outline:none; border-color:var(--brass); }
  .cell-input, .cell-select{
    font-family:var(--font-body);
    font-size:12px;
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:3px;
    color:var(--text);
    padding:6px 7px;
  }
  .cell-input:focus, .cell-select:focus{ outline:none; border-color:var(--brass); }
  .cell-input-date{ width:130px; font-family:var(--font-mono); font-size:12px; }
  .cell-input-name{ width:150px; }
  .cell-input-vendor{ width:100px; }
  .cell-input-note{ width:130px; }
  .cell-select{ width:100px; }
  .group-select{
    width:130px;
    font-family:var(--font-body);
    font-size:12px;
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:3px;
    color:var(--text);
    padding:5px 6px;
  }
  .group-select:focus{ outline:none; border-color:var(--brass); }
  .group-hint{
    font-size:12px;
    color:var(--text-muted);
    line-height:1.6;
    margin:-6px 0 14px;
  }
  .groups-bar{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:28px;
  }
  .group-card{
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--surface);
    border:1.5px dashed var(--border);
    border-radius:5px;
    padding:10px 12px;
    min-width:150px;
    cursor:default;
    transition:border-color .15s ease, background .15s ease;
  }
  .group-card.drag-over{
    border-color:var(--brass);
    background:var(--surface-2);
    border-style:solid;
  }
  .group-card-none{ border-style:solid; border-color:var(--border-soft); }
  .group-card-main{ flex:1; }
  .group-card-name{
    font-size:13px;
    font-weight:600;
    color:var(--text);
    margin-bottom:3px;
  }
  .group-card-sum{
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--text-muted);
  }
  .group-del-btn{
    background:none;
    border:none;
    color:var(--text-faint);
    cursor:pointer;
    font-size:16px;
    line-height:1;
    padding:2px 4px;
    border-radius:3px;
  }
  .group-del-btn:hover{ color:var(--rust); background:rgba(189,81,56,.12); }
  .group-add{
    display:flex;
    gap:6px;
    align-items:center;
  }
  .group-add input{
    font-family:var(--font-body);
    font-size:12px;
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:3px;
    color:var(--text);
    padding:9px 10px;
    width:170px;
  }
  .group-add input:focus{ outline:none; border-color:var(--brass); }
  .ledger tbody tr[draggable="true"]{ cursor:grab; }
  .ledger tbody tr[draggable="true"]:active{ cursor:grabbing; }

  /* ---------- Overview ---------- */
  .overview-summary{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:14px;
    margin-bottom:30px;
  }
  .compare-table{ width:100%; border-collapse:collapse; margin-bottom:36px; }
  .compare-table th{
    text-align:left;
    font-family:var(--font-mono);
    font-size:10px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--text-faint);
    padding:0 10px 10px;
    border-bottom:1px solid var(--border);
  }
  .compare-table td{
    padding:12px 10px;
    border-bottom:1px solid var(--border-soft);
    font-size:13px;
  }
  .compare-table .num{ font-family:var(--font-mono); text-align:right; }
  .chart-bars{ display:flex; flex-direction:column; gap:12px; }
  .chart-row{ display:flex; align-items:center; gap:14px; }
  .chart-name{ width:120px; flex-shrink:0; font-size:13px; color:var(--text-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .chart-track{ flex:1; height:22px; background:var(--surface-2); border-radius:3px; overflow:hidden; }
  .chart-fill{ height:100%; background:linear-gradient(90deg, var(--brass-dim), var(--brass)); display:flex; align-items:center; }
  .chart-fill-label{ font-family:var(--font-mono); font-size:11px; color:#FFFFFF; padding-left:8px; white-space:nowrap; font-weight:600;}

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:var(--surface-3); border:1px solid var(--border);
    color:var(--text); padding:10px 18px; border-radius:4px;
    font-size:13px; font-family:var(--font-mono);
    opacity:0; pointer-events:none; transition:opacity .25s ease;
    z-index:50;
  }
  .toast.show{ opacity:1; }

  @media (max-width: 860px){
    #app{ flex-direction:column; }
    .sidebar{ width:100%; border-right:none; border-bottom:1px solid var(--border-soft); }
    .expense-form{ grid-template-columns:1fr 1fr; }
  }

  /* ---------- Lock screen ---------- */
  .lock-screen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--bg);
    padding:20px;
  }
  .lock-card{
    width:100%;
    max-width:340px;
    background:var(--surface);
    border:1px solid var(--border-soft);
    border-radius:6px;
    padding:32px 28px;
    text-align:center;
    box-shadow:0 4px 24px rgba(44,50,69,0.08);
  }
  .lock-eyebrow{
    font-family:var(--font-mono);
    font-size:10px;
    letter-spacing:.16em;
    color:var(--brass);
    text-transform:uppercase;
    margin-bottom:8px;
  }
  .lock-title{
    font-family:var(--font-display);
    font-size:20px;
    font-weight:700;
    color:var(--text);
    margin-bottom:10px;
  }
  .lock-desc{
    font-size:12px;
    color:var(--text-muted);
    line-height:1.6;
    margin:0 0 20px;
  }
  .lock-input{
    width:100%;
    font-family:var(--font-mono);
    font-size:14px;
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:3px;
    color:var(--text);
    padding:10px 12px;
    margin-bottom:12px;
    text-align:center;
  }
  .lock-input:focus{ outline:none; border-color:var(--brass); }
  .lock-error{
    color:var(--rust);
    font-size:12px;
    margin-top:10px;
    min-height:16px;
  }
</style>

<div id="lockScreen" class="lock-screen">
  <div class="lock-card">
    <div class="lock-eyebrow">PRODUCT COST LEDGER</div>
    <div class="lock-title">請輸入密碼</div>
    <p class="lock-desc">這是川禾內部的產品成本台帳，僅限知道密碼的人使用。</p>

<script>
/* =========================================================
   設定區：請依照說明填入你自己的資訊
   ========================================================= */

// 1) 到 https://console.firebase.google.com 建立專案 → 專案設定 → 一般 → 新增網頁應用程式
//    把產生的設定物件貼進來取代下面這個
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDma3bVuH7HU2Q0Snq-2BMpwhvk5FQ_jak",
  authDomain: "chuanho-cost.firebaseapp.com",
  projectId: "chuanho-cost",
  storageBucket: "chuanho-cost.firebasestorage.app",
  messagingSenderId: "113524287240",
  appId: "1:113524287240:web:08f4a68217e90826feaebd"
};

// 2) 進入密碼：預設是 chuanho2026，要換的話直接改這個字串就好（純前端比對，僅用來擋隨便路過的人）
const ACCESS_PASSWORD = "chuanho2026";

/* ========================================================= */

firebase.initializeApp(FIREBASE_CONFIG);
const db = firebase.firestore();
const PRODUCTS_COLLECTION = 'products';

function checkPassword(){
  const input = document.getElementById('lockPasswordInput');
  const err = document.getElementById('lockError');
  if(input.value === ACCESS_PASSWORD){
    document.getElementById('lockScreen').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    loadAll();
  }else{
    err.textContent = '密碼錯誤，請再試一次';
    input.value = '';
    input.focus();
  }
}
document.addEventListener('DOMContentLoaded', ()=>{
  const pwInput = document.getElementById('lockPasswordInput');
  if(pwInput){
    pwInput.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') checkPassword(); });
    pwInput.focus();
  }
  // 每次開啟網頁都需要重新輸入密碼，不記住解鎖狀態
});

const CATEGORIES = ['材料費','加工費','檢驗費','包裝費','運費','其他'];

const state = {
  projects: {},      // id -> project object
  order: [],          // display order of ids
  currentId: null,
  view: 'detail',
  loaded: false
};

const sortState = {}; // productId -> { field, dir }

function fmtMoney(n){
  n = Number(n)||0;
  return 'NT$ ' + Math.round(n).toLocaleString('zh-TW');
}
function fmtMoney2(n){
  n = Number(n)||0;
  return 'NT$ ' + n.toLocaleString('zh-TW', {maximumFractionDigits:2, minimumFractionDigits:0});
}
function uid(prefix){
  return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._h);
  showToast._h = setTimeout(()=>t.classList.remove('show'), 1800);
}

async function saveProject(p){
  try{
    await db.collection(PRODUCTS_COLLECTION).doc(p.id).set(p);
  }catch(e){
    console.error(e);
    showToast('儲存發生錯誤，請檢查網路連線');
  }
}
async function deleteProjectStorage(id){
  try{
    await db.collection(PRODUCTS_COLLECTION).doc(id).delete();
  }catch(e){ console.error(e); showToast('刪除時發生錯誤'); }
}
async function loadAll(){
  try{
    const snapshot = await db.collection(PRODUCTS_COLLECTION).get();
    const projects = {};
    const order = [];
    snapshot.forEach(doc=>{
      const p = doc.data();
      if(p && p.id){
        projects[p.id] = p;
        order.push(p.id);
      }
    });
    order.sort((a,b)=> (projects[a].createdAt||0) - (projects[b].createdAt||0));
    state.projects = projects;
    state.order = order;
    state.currentId = order.length ? order[0] : null;
  }catch(e){
    console.error(e);
    showToast('讀取資料時發生錯誤');
  }
  state.loaded = true;
  render();
}

// ---------- Actions ----------
const app = {
  async createProject(){
    const p = {
      id: uid('p_'),
      name: '新產品',
      quantity: 1,
      sellingPrice: 0,
      createdAt: Date.now(),
      expenses: [],
      groups: []
    };
    state.projects[p.id] = p;
    state.order.push(p.id);
    state.currentId = p.id;
    state.view = 'detail';
    render();
    await saveProject(p);
  },
  selectProject(id){
    state.currentId = id;
    state.view = 'detail';
    render();
  },
  setView(v){
    state.view = v;
    render();
  },
  async updateProjectField(id, field, value){
    const p = state.projects[id];
    if(!p) return;
    if(field === 'quantity' || field === 'sellingPrice'){
      value = Number(value);
      if(isNaN(value) || value < 0) value = 0;
    }
    p[field] = value;
    renderSidebar();
    renderContent();
    await saveProject(p);
  },
  async addExpense(id){
    try{
      const p = state.projects[id];
      if(!p){ showToast('找不到這個產品，請重新整理'); return; }
      const categoryEl = document.getElementById('expCategory');
      const nameEl = document.getElementById('expName');
      const amountEl = document.getElementById('expAmount');
      const amortizeEl = document.getElementById('expAmortizeQty');
      const dateEl = document.getElementById('expDate');
      const vendorEl = document.getElementById('expVendor');
      const noteEl = document.getElementById('expNote');
      if(!nameEl || !amountEl){ showToast('表單尚未載入完成，請稍後再試'); return; }

      const category = categoryEl ? categoryEl.value : '其他';
      const name = (nameEl.value || '').trim();
      const amountRaw = (amountEl.value || '').trim();
      const amount = Number(amountRaw);
      const amortizeRaw = (amortizeEl ? amortizeEl.value : '').trim();
      const amortizeQty = amortizeRaw ? Number(amortizeRaw) : null;
      const date = dateEl ? dateEl.value : '';
      const vendor = (vendorEl ? vendorEl.value : '').trim();
      const note = (noteEl ? noteEl.value : '').trim();

      if(!name){ showToast('請先輸入品項名稱，例如「檢驗費」'); return; }
      if(!amountRaw || isNaN(amount) || amount <= 0){ showToast('請輸入大於 0 的金額'); return; }
      if(amortizeRaw && (isNaN(amortizeQty) || amortizeQty <= 0)){ showToast('攤提數量請輸入大於 0 的數字，或留空'); return; }

      p.expenses.push({ id: uid('e_'), category, name, amount, amortizeQty: (amortizeQty && amortizeQty > 0) ? amortizeQty : null, date, vendor, note, groupId: null });
      render();
      await saveProject(p);
      showToast('已新增開銷項目');
    }catch(err){
      console.error(err);
      showToast('新增失敗：' + (err && err.message ? err.message : '未知錯誤'));
    }
  },
  async deleteExpense(pid, eid){
    const p = state.projects[pid];
    if(!p) return;
    p.expenses = p.expenses.filter(e => e.id !== eid);
    render();
    await saveProject(p);
  },
  async moveExpense(pid, eid, direction){
    const p = state.projects[pid];
    if(!p) return;
    const idx = p.expenses.findIndex(e => e.id === eid);
    if(idx === -1) return;
    const targetIdx = direction === 'up' ? idx - 1 : idx + 1;
    if(targetIdx < 0 || targetIdx >= p.expenses.length) return;
    const tmp = p.expenses[idx];
    p.expenses[idx] = p.expenses[targetIdx];
    p.expenses[targetIdx] = tmp;
    render();
    await saveProject(p);
  },
  async sortExpenses(pid, field){
    const p = state.projects[pid];
    if(!p) return;
    const prev = sortState[pid];
    const dir = (prev && prev.field === field && prev.dir === 'asc') ? 'desc' : 'asc';
    sortState[pid] = { field, dir };

    const groupNameById = {};
    (p.groups||[]).forEach(g=>{ groupNameById[g.id] = g.name; });

    const numericFields = ['amount','amortizeQty'];
    const getValue = (e)=>{
      if(field === 'group'){
        return (e.groupId && groupNameById[e.groupId]) ? groupNameById[e.groupId] : '';
      }
      if(field === 'amortizeQty'){
        return e.amortizeQty ? Number(e.amortizeQty) : (Number(p.quantity)||0);
      }
      if(field === 'amount'){
        return Number(e.amount) || 0;
      }
      return (e[field] || '').toString();
    };

    p.expenses.sort((a,b)=>{
      const va = getValue(a), vb = getValue(b);
      let cmp;
      if(numericFields.includes(field)){
        cmp = va - vb;
      }else{
        cmp = va.localeCompare(vb, 'zh-TW');
      }
      return dir === 'asc' ? cmp : -cmp;
    });

    render();
    await saveProject(p);
  },
  async updateExpenseAmortize(pid, eid, value){
    const p = state.projects[pid];
    if(!p) return;
    const e = p.expenses.find(x => x.id === eid);
    if(!e) return;
    const raw = (value || '').toString().trim();
    if(!raw){
      e.amortizeQty = null;
    }else{
      const n = Number(raw);
      if(isNaN(n) || n <= 0){ showToast('攤提數量請輸入大於 0 的數字，或清空欄位'); render(); return; }
      e.amortizeQty = n;
    }
    render();
    await saveProject(p);
  },
  async updateExpenseAmount(pid, eid, value){
    const p = state.projects[pid];
    if(!p) return;
    const e = p.expenses.find(x => x.id === eid);
    if(!e) return;
    const raw = (value || '').toString().trim();
    const n = Number(raw);
    if(!raw || isNaN(n) || n <= 0){
      showToast('金額請輸入大於 0 的數字');
      render();
      return;
    }
    e.amount = n;
    render();
    await saveProject(p);

  async updateExpenseField(pid, eid, field, value){
    const p = state.projects[pid];
    if(!p) return;
    const e = p.expenses.find(x => x.id === eid);
    if(!e) return;
    if(field === 'name'){
      const v = (value||'').toString().trim();
      if(!v){ showToast('品項名稱不能是空的'); render(); return; }
      e.name = v;
    }else if(field === 'date'){
      e.date = value || '';
    }else if(field === 'category'){
      e.category = value || '其他';
    }else if(field === 'vendor'){
      e.vendor = (value||'').toString().trim();
    }else if(field === 'note'){

  async addGroup(pid){

// ---------- Calculations ----------
function calc(p){
  const totalCost = p.expenses.reduce((s,e)=> s + (Number(e.amount)||0), 0);
  const qty = Number(p.quantity) || 0;
  let unitCost = 0;
  p.expenses.forEach(e=>{
    const amt = Number(e.amount) || 0;
    const basis = (e.amortizeQty && Number(e.amortizeQty) > 0) ? Number(e.amortizeQty) : qty;
    if(basis > 0){ unitCost += amt / basis; }
  });
  const sellingPrice = Number(p.sellingPrice) || 0;
  const grossProfit = sellingPrice - unitCost;
  const grossMargin = sellingPrice > 0 ? (grossProfit / sellingPrice) * 100 : null;
  const byCategory = {};
  p.expenses.forEach(e=>{
    byCategory[e.category] = (byCategory[e.category]||0) + (Number(e.amount)||0);
  });
  return { totalCost, qty, unitCost, sellingPrice, grossProfit, grossMargin, byCategory };
}

function expenseUnitContribution(e, productQty){
  const amt = Number(e.amount) || 0;
  const basis = (e.amortizeQty && Number(e.amortizeQty) > 0) ? Number(e.amortizeQty) : productQty;
  return basis > 0 ? amt / basis : 0;
}

// ---------- Rendering ----------
function render(){
  renderSidebar();
  renderTabs();
  renderContent();
}

function renderSidebar(){
  const list = document.getElementById('projectList');
  if(!state.loaded){
    list.innerHTML = '<div class="empty-sidebar-hint">載入中...</div>';
    return;
  }
  if(state.order.length === 0){
    list.innerHTML = '<div class="empty-sidebar-hint">尚無產品，點選下方按鈕開始建立成本台帳。</div>';
    return;
  }
  list.innerHTML = state.order.map(id=>{
    const p = state.projects[id];
    const c = calc(p);
    const active = id === state.currentId ? 'active' : '';
    return `<button class="project-tab ${active}" onclick="app.selectProject('${id}')">
      <span class="project-tab-name">${escapeHtml(p.name || '未命名產品')}</span>
      <span class="project-tab-cost">${fmtMoney(c.totalCost)}</span>
    </button>`;
  }).join('');
}

function renderTabs(){
  document.getElementById('tabDetail').classList.toggle('active', state.view === 'detail');
  document.getElementById('tabOverview').classList.toggle('active', state.view === 'overview');
}

function renderContent(){
  const el = document.getElementById('content');
  if(!state.loaded){
    el.innerHTML = '<div class="empty-state"><h2>載入中</h2><p>正在讀取你的成本資料...</p></div>';
    return;
  }
  if(state.view === 'overview'){
    el.innerHTML = renderOverview();
    return;
  }
  if(!state.currentId || !state.projects[state.currentId]){
    el.innerHTML = `<div class="empty-state">
      <h2>還沒有任何產品</h2>
      <p>每個產品是一個獨立的成本台帳：先建立產品，填入生產數量與售價，接著登記所有開銷項目，系統會自動加總並換算單位成本與毛利。</p>
      <button class="btn btn-primary" onclick="app.createProject()">+ 新增第一個產品</button>
    </div>`;
    return;
  }
  el.innerHTML = renderDetail(state.projects[state.currentId]);
  const dateInput = document.getElementById('expDate');
  if(dateInput && !dateInput.value){ dateInput.value = new Date().toISOString().slice(0,10); }
}

      <td>
        <div class="row-actions">
          <button class="row-move-btn" ${isFirst?'disabled':''} onclick="app.moveExpense('${p.id}','${e.id}','up')" title="上移">▲</button>
          <button class="row-move-btn" ${isLast?'disabled':''} onclick="app.moveExpense('${p.id}','${e.id}','down')" title="下移">▼</button>
          <button class="row-del-btn" onclick="app.deleteExpense('${p.id}','${e.id}')">刪除</button>
        </div>
      </td>
    </tr>`;
  }).join('') || `<tr><td colspan="9" class="muted-cell" style="text-align:center; padding:24px 0;">尚無開銷項目，於下方表單新增第一筆</td></tr>`;

  const catOptions = CATEGORIES.map(c=>`<option value="${c}">${c}</option>`).join('');

  const currentSort = sortState[p.id] || {};
  function sortableHeader(field, label, alignRight){
    const isActive = currentSort.field === field;
    const arrow = isActive ? (currentSort.dir === 'asc' ? ' ▲' : ' ▼') : '';
    const style = alignRight ? ' style="text-align:right;"' : '';
    return `<th${style}><button class="th-sort-btn" onclick="app.sortExpenses('${p.id}','${field}')">${label}${arrow}</button></th>`;
  }

  return `
    <div class="product-header">
      <div>
        <input class="product-title-input" value="${escapeAttr(p.name)}"
          onchange="app.updateProjectField('${p.id}','name', this.value)" placeholder="產品名稱">
        <div class="product-meta">
          <div class="meta-field">
            <label>生產數量</label>
            <input type="number" min="0" step="1" value="${p.quantity}"
              onchange="app.updateProjectField('${p.id}','quantity', this.value)">
          </div>
          <div class="meta-field">
            <label>售價 / 個</label>
            <input type="number" min="0" step="0.01" value="${p.sellingPrice}"
              onchange="app.updateProjectField('${p.id}','sellingPrice', this.value)">
          </div>
          <div class="meta-field">
            <label>建立日期</label>
            <input type="text" value="${new Date(p.createdAt).toLocaleDateString('zh-TW')}" disabled>
          </div>
        </div>
      </div>
      <button class="btn btn-danger btn-sm" id="delbtn_${p.id}" onclick="app.deleteProject('${p.id}')">刪除此產品</button>
    </div>

    <div class="stat-row">
      <div class="stat-card">
        <div class="stat-label">總成本</div>
        <div class="stat-value">${fmtMoney(c.totalCost)}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">單位成本 · 每個</div>
        <div class="stat-value">${fmtMoney2(c.unitCost)}</div>
        <div class="stat-hint">依各項目攤提數量分別計算後加總</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">毛利 · 每個</div>
        <div class="stat-value ${profitClass}">${fmtMoney2(c.grossProfit)}</div>
      </div>
      <div class="stat-card stamp-card">
        <div class="stamp ${marginClass}">
          <div class="stamp-pct">${marginText}</div>
          <div class="stamp-label">毛利率</div>
        </div>
      </div>
    </div>

    <div class="section-title">開銷分類佔比</div>
    <div class="breakdown">${catRows}</div>

    <div class="section-title">自訂群組</div>
    <p class="group-hint">建立群組（例如「PIF 需要的資料」），把下方明細表格中的項目拖曳到群組卡片上即可歸類；也可以用每列右側的下拉選單直接指定。</p>
    <div class="groups-bar">
      ${noneCard}
      ${groupCards}
      <div class="group-add">
        <input type="text" id="newGroupName" placeholder="新增群組名稱">
        <button class="btn btn-sm" onclick="app.addGroup('${p.id}')">+ 新增群組</button>
      </div>
    </div>

    <div class="section-title">新增開銷項目</div>
    <div class="expense-form" id="expenseForm" data-project-id="${p.id}">
      <div class="field">
        <label>分類</label>
        <select id="expCategory">${catOptions}</select>
      </div>
      <div class="field">
        <label>品項名稱</label>
        <input type="text" id="expName" placeholder="例如：檢驗費">
      </div>
      <div class="field">
        <label>金額</label>
        <input type="number" id="expAmount" min="0" step="0.01" placeholder="0">
      </div>
      <div class="field">
        <label>攤提數量</label>
        <input type="number" id="expAmortizeQty" min="0" step="1" placeholder="預設用生產數量">
      </div>
      <div class="field">
        <label>日期</label>
        <input type="date" id="expDate">
      </div>
      <div class="field">
        <label>廠商</label>
        <input type="text" id="expVendor" placeholder="選填">
      </div>
      <div class="field">
        <label>備註</label>
        <input type="text" id="expNote" placeholder="選填">
      </div>
      <button type="button" class="btn btn-primary" onclick="app.addExpense('${p.id}')">+ 新增</button>
    </div>

    <div class="section-title">開銷明細台帳</div>
    <table class="ledger">
      <thead><tr>
        ${sortableHeader('date','日期')}
        ${sortableHeader('category','分類')}
        ${sortableHeader('name','品項')}
        ${sortableHeader('amount','金額', true)}
        ${sortableHeader('amortizeQty','攤提數量')}
        ${sortableHeader('group','群組')}
        ${sortableHeader('vendor','廠商')}
        ${sortableHeader('note','備註')}
        <th></th>
      </tr></thead>
      <tbody>${expenseRows}</tbody>
      <tfoot><tr>
        <td colspan="3">合計</td>
        <td class="num">${fmtMoney(c.totalCost)}</td>
        <td colspan="5"></td>
      </tr></tfoot>
    </table>
  `;
}

function renderOverview(){
  const ids = state.order;
  if(ids.length === 0){
    return `<div class="empty-state"><h2>還沒有資料可比較</h2><p>先建立至少一個產品並登記開銷項目，這裡會自動列出所有產品的成本比較。</p></div>`;
  }
  const rows = ids.map(id=>{
    const p = state.projects[id];
    const c = calc(p);
    return { p, c };
  });
  const grandTotal = rows.reduce((s,r)=> s + r.c.totalCost, 0);
  const avgMargin = (()=>{
    const withMargin = rows.filter(r=> r.c.grossMargin !== null);
    if(!withMargin.length) return null;
    return withMargin.reduce((s,r)=> s + r.c.grossMargin, 0) / withMargin.length;
  })();
  const maxUnitCost = Math.max(...rows.map(r=> r.c.unitCost), 0.0001);

  const tableRows = rows.map(({p,c})=>{
    const marginText = c.grossMargin === null ? '—' : c.grossMargin.toFixed(1) + '%';
    const marginColor = c.grossMargin === null ? 'muted-cell' : (c.grossMargin >= 0 ? '' : '');
    const marginStyle = c.grossMargin === null ? '' : `style="color:${c.grossMargin>=0 ? 'var(--sage)' : 'var(--rust)'}"`;
    return `<tr>
      <td>${escapeHtml(p.name)}</td>
      <td class="num">${p.quantity}</td>
      <td class="num">${fmtMoney(c.totalCost)}</td>
      <td class="num">${fmtMoney2(c.unitCost)}</td>
      <td class="num" ${marginStyle}>${marginText}</td>
    </tr>`;
  }).join('');

  const chartRows = rows.map(({p,c})=>{
    const pct = (c.unitCost / maxUnitCost) * 100;
    return `<div class="chart-row">
      <div class="chart-name">${escapeHtml(p.name)}</div>
      <div class="chart-track"><div class="chart-fill" style="width:${Math.max(pct,4).toFixed(1)}%"><span class="chart-fill-label">${fmtMoney2(c.unitCost)}</span></div></div>
    </div>`;
  }).join('');

  return `
    <div class="section-title">全部產品總覽</div>
    <div class="overview-summary">
      <div class="stat-card">
        <div class="stat-label">產品數</div>
        <div class="stat-value">${ids.length}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">總成本合計</div>
        <div class="stat-value">${fmtMoney(grandTotal)}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">平均毛利率</div>
        <div class="stat-value" style="color:${avgMargin===null?'var(--text)':(avgMargin>=0?'var(--sage)':'var(--rust)')}">${avgMargin===null?'—':avgMargin.toFixed(1)+'%'}</div>
      </div>
    </div>

    <div class="section-title">單位成本比較</div>
    <div class="chart-bars" style="margin-bottom:36px;">${chartRows}</div>

    <div class="section-title">明細比較表</div>
    <table class="compare-table">
      <thead><tr><th>產品</th><th style="text-align:right;">數量</th><th style="text-align:right;">總成本</th><th style="text-align:right;">單位成本</th><th style="text-align:right;">毛利率</th></tr></thead>
      <tbody>${tableRows}</tbody>
    </table>
  `;
}

function excelSafeSheetName(name, usedSet){
  let s = String(name || '產品').replace(/[:\\\/\?\*\[\]]/g, '_').trim().slice(0, 31);
  if(!s) s = '產品';
  let base = s, i = 1;
  while(usedSet.has(s)){
    const suffix = '_' + i;
    s = base.slice(0, Math.max(1, 31 - suffix.length)) + suffix;
    i++;
  }
  usedSet.add(s);
  return s;
}

function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeAttr(s){ return escapeHtml(s); }
